name: Build portable release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/setup-nuget@v2
      - name: Build portable package
        shell: powershell
        run: .\scripts\build-release.ps1
      - name: Portable startup smoke test
        shell: powershell
        run: |
          $app = Start-Process .\artifacts\QQMusicWallpaper-v1.0.0-win-x64\QQMusicWallpaper.exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Controller exited during startup with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: QQMusicWallpaper-win-x64
          path: artifacts/QQMusicWallpaper-v1.0.0-win-x64.zip
